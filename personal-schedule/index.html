<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#131124"><title>个人日程 · NIGHT PLAN</title><style>
*{box-sizing:border-box}body{margin:0;color:#faf5ff;background:#131124;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 10% 0%,#6140a0,transparent 60%),radial-gradient(ellipse at 90% 80%,#146175,transparent 70%),#131124;background-size:cover;background-position:center;z-index:-1}#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#11102055,#111020cc)}main{max-width:820px;margin:auto;padding:22px 14px 70px}header,.bar,.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{margin:4px 0 8px;font-size:30px}h2{font-size:17px;margin:0 0 12px}small,.muted{font-size:12px;color:#bcb2d8}.brand{color:#8de9ff;letter-spacing:4px;font-size:11px;font-weight:bold}section{margin:14px 0;background:#19162edc;border:1px solid #ffffff24;backdrop-filter:blur(13px);border-radius:19px;padding:15px;box-shadow:0 8px 25px #0004}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #ffffff29;border-radius:10px;padding:9px 12px;background:#ffffff12}button:disabled{opacity:.4}button.primary{background:linear-gradient(110deg,#9b52ee,#286ecb);border:0;font-weight:bold}button:focus-visible,[tabindex]:focus-visible{outline:2px solid #91efff}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.day{min-height:44px;padding:7px 0;position:relative}.today{border-color:#80e7ff!important}.sel{background:#7951c5!important;border-color:#bba3ff!important}.dot{display:block;width:5px;height:5px;background:#89e8ff;border-radius:50%;margin:4px auto 0}.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-width:0;min-height:75px;border:1px solid #ffffff24;border-radius:12px;background:#ffffff08;padding:10px;cursor:pointer}.tile strong{color:#a5e6ff;font-size:12px}.tile p{margin:6px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.tile small{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.done{text-decoration:line-through;opacity:.55}.batch{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.batch button{font-size:12px}.notice{border-left:3px solid #e5a3ff;background:#a56fe51b;border-radius:8px;padding:10px;margin:8px 0;overflow-wrap:anywhere}.notice b{color:#f2c2ff}.task{border-bottom:1px solid #ffffff20;padding:12px 0;overflow-wrap:anywhere}.task:last-child{border:0}.task p{white-space:pre-wrap;color:#d5c9ea}.task h3{margin:0 0 5px;font-size:16px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px}.empty{text-align:center;padding:15px;color:#b9afd0}.tag{color:#a1eaff;font-size:11px}.footer{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}dialog{width:min(94%,480px);max-height:90vh;overflow:auto;background:#221a38;color:white;border:1px solid #8974c4;border-radius:20px;padding:20px}dialog::backdrop{background:#090716bd}label{display:block;margin:12px 0 5px;color:#e0d1f8}input:not([type=file]),textarea,select{width:100%;background:#100e20;border:1px solid #ffffff35;border-radius:10px;padding:11px}textarea{min-height:75px;resize:vertical}option{background:#211b36}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#32254e;border:1px solid #ae93ef;padding:12px 18px;border-radius:12px;z-index:10}[hidden]{display:none!important}@media(min-width:700px){.overview{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><div id="bg"></div><main><header><div><div class="brand">NIGHT / PLAN</div><h1>个人日程</h1><small id="clock"></small></div><button id="wall">更换海报</button><input type="file" id="wallfile" accept="image/*" hidden></header><section><h2>◈ 日程提醒 <small id="count"></small></h2><div id="reminders"></div></section><section><div class="bar"><h2>未来10天 · 日程总览</h2><button id="quickBatch">多选日期</button></div><div id="overview" class="overview"></div></section><section id="calSection"><div class="nav"><button id="prev">‹</button><strong id="month"></strong><button id="today">今天</button><button id="next">›</button></div><div class="batch"><button id="batchToggle">多选日期</button><button id="batch14" hidden>选未来10天</button><button id="batchClear" hidden>清空</button><button id="batchAdd" class="primary" hidden>批量新增</button></div><p id="batchInfo" class="muted" hidden>点击日期或上方10天卡片选择／取消，可跨月选择。</p><div id="calendar" class="grid"></div></section><section id="detail"><div class="bar"><h2 id="dateTitle"></h2><button class="primary" id="add">＋ 添加计划</button></div><div id="tasks"></div></section><div class="footer"><button id="export">导出备份</button><button id="import">恢复备份</button><input id="importfile" type="file" accept="application/json,.json" hidden><button id="resetwall">恢复默认背景</button></div><p class="muted" style="text-align:center">V1.2 · 北京时间 · 数据仅保存在本设备 · 打开网页查看提醒</p></main><dialog id="editor"><form id="form"><h2 id="editTitle"></h2><div id="dateField"><label for="date">日期</label><input id="date" type="date" required></div><p id="batchDates" hidden></p><label for="title">计划内容</label><textarea id="title" maxlength="500" required></textarea><label for="note">备注</label><textarea id="note" maxlength="2000"></textarea><label for="lead">提前提醒</label><select id="lead"><option value="-1">不提醒</option><option value="1">提前1天</option><option value="3">提前3天</option><option value="7">提前7天</option></select><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><div id="toast" hidden role="status"></div><script>
"use strict";const $=id=>document.getElementById(id),KEY="night-plan-v1",BG="night-plan-wall-v1",W=["周日","周一","周二","周三","周四","周五","周六"];
function now(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return p.year+"-"+p.month+"-"+p.day}
const dateObj=s=>new Date(s+"T00:00:00Z"),dn=s=>dateObj(s).getTime()/86400000,fmt=s=>{const d=dateObj(s);return (d.getUTCMonth()+1)+"月"+d.getUTCDate()+"日 "+W[d.getUTCDay()]},id=()=>globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random(),days=()=>Array.from({length:10},(_,i)=>new Date((dn(now())+i)*86400000).toISOString().slice(0,10));
function valid(x){return x&&typeof x.id==="string"&&typeof x.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&Number.isFinite(dn(x.date))&&dateObj(x.date).toISOString().slice(0,10)===x.date&&typeof x.title==="string"&&x.title.trim()&&typeof x.note==="string"&&[-1,1,3,7].includes(x.lead)&&typeof x.done==="boolean"}
let data=[];try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(a))data=a.filter(valid)}catch{}let selected=now(),cursor=selected.slice(0,7),batch=false,picks=new Set(),editing=null,pending=[];
function el(tag,cls,txt){const a=document.createElement(tag);if(cls)a.className=cls;if(txt!==undefined)a.textContent=txt;return a}
function btn(t,f){const b=el("button","",t);b.onclick=f;return b}
function toast(t){$("toast").textContent=t;$("toast").hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").hidden=true,2200)}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a));data=a;return true}catch{alert("保存失败，请检查浏览器存储空间");return false}}
function choose(s,jump=false){if(batch){picks.has(s)?picks.delete(s):picks.add(s)}else{selected=s;cursor=s.slice(0,7)}render();if(jump&&!batch)$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
function setBatch(){batch=!batch;picks.clear();render()}
function render(){const t=now();$("clock").textContent=t+" · "+W[dateObj(t).getUTCDay()]+" · UTC+8";$("month").textContent=cursor.replace("-","年")+"月";$("batchToggle").textContent=batch?"退出多选":"多选日期";$("quickBatch").textContent=batch?"退出多选":"多选日期";for(const k of ["batch14","batchClear","batchAdd","batchInfo"])$(k).hidden=!batch;$("batchAdd").textContent="批量新增 ("+picks.size+")";$("batchAdd").disabled=!picks.size;
const r=$("reminders");r.replaceChildren();const rem=data.filter(x=>!x.done&&x.lead>=0&&dn(x.date)-dn(t)<=x.lead).sort((a,b)=>a.date.localeCompare(b.date));$("count").textContent=rem.length?" · "+rem.length+"项":"";if(!rem.length)r.append(el("div","empty","暂无到期提醒"));rem.forEach(x=>{const n=dn(x.date)-dn(t),a=el("div","notice");a.append(el("b","",n<0?"已逾期"+(-n)+"天":n===0?"今天":"还有"+n+"天"),el("div","",fmt(x.date)+" · "+x.title));if(x.note)a.append(el("small","",x.note));a.append(btn("查看计划",()=>{batch=false;picks.clear();choose(x.date,true)}));r.append(a)});
const o=$("overview");o.replaceChildren();for(const s of days()){const a=el("div","tile"+((batch?picks.has(s):selected===s)?" sel":"")+(s===t?" today":""));a.tabIndex=0;a.setAttribute("role","button");a.setAttribute("aria-pressed",String(batch?picks.has(s):selected===s));a.onclick=()=>choose(s,true);a.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(s,true)}};a.append(el("strong","",fmt(s)+(s===t?" · 今天":"")));const items=data.filter(x=>x.date===s);if(!items.length)a.append(el("small","","暂无计划"));for(const x of items){a.append(el("p",x.done?"done":"",x.title));if(x.note)a.append(el("small","",x.note))}o.append(a)}
const c=$("calendar");c.replaceChildren();["一","二","三","四","五","六","日"].forEach(x=>c.append(el("small","",x)));const [y,m]=cursor.split("-").map(Number),start=new Date(Date.UTC(y,m-1,1)),n=new Date(Date.UTC(y,m,0)).getUTCDate();for(let i=0;i<(start.getUTCDay()+6)%7;i++)c.append(el("div"));for(let i=1;i<=n;i++){const s=cursor+"-"+String(i).padStart(2,"0"),b=btn(String(i),()=>choose(s));b.className="day"+((batch?picks.has(s):selected===s)?" sel":"")+(s===t?" today":"");b.setAttribute("aria-label",s+" "+fmt(s));b.setAttribute("aria-pressed",String(batch?picks.has(s):selected===s));if(data.some(x=>x.date===s&&!x.done))b.append(el("span","dot"));c.append(b)}
$("dateTitle").textContent=fmt(selected)+" · "+selected.slice(0,4);const l=$("tasks");l.replaceChildren();const items=data.filter(x=>x.date===selected);if(!items.length)l.append(el("div","empty","这一天还没有计划"));for(const x of items){const a=el("article","task");a.append(el("h3",x.done?"done":"",x.title),el("span","tag",x.done?"已完成":x.lead<0?"不提醒":"提前"+x.lead+"天提醒"));if(x.note)a.append(el("p","",x.note));const b=el("div","actions");b.append(btn(x.done?"恢复":"完成",()=>{if(save(data.map(z=>z.id===x.id?{...z,done:!z.done}:z)))render()}),btn("编辑",()=>open(x)),btn("删除",()=>{if(confirm("删除此计划？")&&save(data.filter(z=>z.id!==x.id)))render()}));a.append(b);l.append(a)}}
function shift(i){const [y,m]=cursor.split("-").map(Number);cursor=new Date(Date.UTC(y,m-1+i,1)).toISOString().slice(0,7);if(!batch)selected=cursor+"-01";render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);$("today").onclick=()=>{cursor=now().slice(0,7);if(!batch)selected=now();render()};$("batchToggle").onclick=setBatch;$("quickBatch").onclick=()=>{setBatch();if(batch)$("calSection").scrollIntoView({behavior:"smooth"})};$("batch14").onclick=()=>{days().forEach(s=>picks.add(s));render()};$("batchClear").onclick=()=>{picks.clear();render()};$("batchAdd").onclick=()=>{if(picks.size)open(null,[...picks].sort())};
function open(x,dates=[]){editing=x?x.id:null;pending=dates;$("editTitle").textContent=x?"编辑计划":dates.length?"批量添加计划":"添加计划";$("dateField").hidden=!!dates.length;$("date").required=!dates.length;$("date").value=x?x.date:dates[0]||selected;$("batchDates").hidden=!dates.length;$("batchDates").textContent=dates.length?"为 "+dates.length+" 天添加同一计划："+dates.map(fmt).join("、"):"";$("title").value=x?x.title:"";$("note").value=x?x.note:"";$("lead").value=x?x.lead:-1;$("editor").showModal()}
$("add").onclick=()=>open();$("cancel").onclick=()=>$("editor").close();$("form").onsubmit=e=>{e.preventDefault();const x={id:editing||id(),date:$("date").value,title:$("title").value.trim(),note:$("note").value.trim(),lead:Number($("lead").value),done:editing?!!data.find(z=>z.id===editing)?.done:false};if(!valid(x)){alert("请填写有效日期及计划");return}const a=pending.length?pending.map(s=>({...x,date:s,id:id()})):[x];if(save(editing?data.map(z=>z.id===editing?x:z):[...data,...a])){selected=a[0].date;cursor=selected.slice(0,7);pending=[];batch=false;picks.clear();$("editor").close();render();toast("已保存 "+a.length+" 项")}};
function wall(s){$("bg").style.backgroundImage=s?"url("+JSON.stringify(s)+")":""}try{wall(localStorage.getItem(BG))}catch{}$("wall").onclick=()=>$("wallfile").click();$("wallfile").onchange=()=>{const f=$("wallfile").files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const scale=Math.min(1,1500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);const s=c.toDataURL("image/jpeg",.8);localStorage.setItem(BG,s);wall(s);toast("海报已保存")}catch{alert("海报保存失败，请尝试较小图片")}finally{URL.revokeObjectURL(u)}};im.onerror=()=>{URL.revokeObjectURL(u);alert("无法读取图片")};im.src=u;$("wallfile").value=""};$("resetwall").onclick=()=>{localStorage.removeItem(BG);wall(null)};$("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,plans:data},null,2)],{type:"application/json"}));a.href=u;a.download="night-plan-"+now()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("import").onclick=()=>$("importfile").click();$("importfile").onchange=async()=>{const f=$("importfile").files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.plans)||!o.plans.every(valid)||new Set(o.plans.map(x=>x.id)).size!==o.plans.length)throw Error();if(confirm("恢复将覆盖当前所有计划，确定？")&&save(o.plans)){render();toast("已恢复")}}catch{alert("备份文件格式不正确")}$("importfile").value=""};render();setInterval(render,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
</script></body></html>
