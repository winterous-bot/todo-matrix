<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="待办矩阵"><title>我的待办矩阵</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#182333;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 12px 30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:23px;margin:0}small{color:#718096}.toolbar{display:flex;gap:8px;margin:12px 0 18px}button{font:inherit;cursor:pointer}.toolbar button{background:white;border:1px solid #e0e4eb;border-radius:10px;padding:9px 12px;font-size:12px}.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cell{background:white;border:1px solid #e7eaf0;border-radius:14px;padding:10px 7px;min-height:190px;box-shadow:0 2px 10px #24304808}.cell h2{font-size:15px;margin:0 0 5px}.level{font-size:11px;font-weight:600;margin-bottom:12px}.high{color:#cf534b}.low{color:#718096}.item{display:flex;align-items:flex-start;gap:4px;border:0;background:transparent;width:100%;text-align:left;padding:6px 0;color:#28364b;font-size:12px;line-height:1.45;overflow-wrap:anywhere}.circle{flex:none;width:15px;height:15px;border:1.5px solid #9aa7b8;border-radius:50%;margin-top:1px}.item span:last-child{min-width:0}.add{border:0;background:#f0f4f9;color:#48648c;border-radius:8px;padding:6px 7px;margin-top:8px;font-size:12px;width:100%}.note{margin-top:16px;font-size:12px;color:#7b8797;line-height:1.6}dialog{border:0;border-radius:18px;width:calc(100% - 30px);max-width:420px;padding:22px;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0005}dialog h3{margin:0 0 12px}textarea{width:100%;min-height:85px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit;font-size:16px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.actions button{border:0;border-radius:9px;padding:10px 15px;background:#edf0f5}.actions button.primary{background:#2668d8;color:white}@media(max-width:380px){.wrap{padding-left:7px;padding-right:7px}.matrix{gap:5px}.cell{padding:8px 5px}.item{font-size:11px}} </style></head><body><main class="wrap"><header><div><h1>我的待办矩阵</h1><small>工作 · 生活 · 提升</small></div><small id="count"></small></header><div class="toolbar"><button id="export">导出备份</button><button id="import">导入备份</button><input id="file" type="file" accept="application/json,.json" hidden></div><section class="matrix" id="matrix"></section><p class="note">点击圆圈完成任务；任务完成后从矩阵移除。数据保存在当前浏览器中，请定期导出备份。</p></main><dialog id="dlg"><h3 id="dlgTitle">添加待办</h3><textarea id="taskText" placeholder="输入待办内容"></textarea><div class="actions"><button id="cancel">取消</button><button class="primary" id="save">添加</button></div></dialog><script>const KEY='personal-todo-matrix-v1';const groups=[['工作','高'],['生活','高'],['提升','高'],['工作','低'],['生活','低'],['提升','低']];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!Array.isArray(data)||data.length!==6)data=groups.map(()=>[]);let active=0;const matrix=document.getElementById('matrix'),dlg=document.getElementById('dlg'),taskText=document.getElementById('taskText');function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){matrix.replaceChildren();let total=0;groups.forEach(([name,level],i)=>{const cell=document.createElement('article');cell.className='cell';const title=document.createElement('h2');title.textContent=name;const badge=document.createElement('div');badge.className='level '+(level==='高'?'high':'low');badge.textContent=level+'优先级';cell.append(title,badge);data[i].forEach((task,j)=>{total++;const b=document.createElement('button');b.className='item';b.title='点击完成并移除';const c=document.createElement('span');c.className='circle';const t=document.createElement('span');t.textContent=task;b.append(c,t);b.onclick=()=>{if(confirm('标记完成并移除「'+task+'」？')){data[i].splice(j,1);persist();render()}};cell.append(b)});const add=document.createElement('button');add.className='add';add.textContent='＋ 添加';add.onclick=()=>{active=i;document.getElementById('dlgTitle').textContent='添加到 '+name+' · '+level;taskText.value='';dlg.showModal();taskText.focus()};cell.append(add);matrix.append(cell)});document.getElementById('count').textContent=total+' 项待办'}document.getElementById('cancel').onclick=()=>dlg.close();document.getElementById('save').onclick=()=>{const t=taskText.value.trim();if(!t)return;data[active].push(t);persist();render();dlg.close()};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,groups,data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='待办矩阵备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.data)||v.data.length!==6||!v.data.every(g=>Array.isArray(g)&&g.every(t=>typeof t==='string')))throw Error();if(confirm('导入将覆盖当前全部待办，确定继续？')){data=v.data;persist();render()}}catch{alert('备份文件格式不正确')}e.target.value=''};render();</script></body></html>
